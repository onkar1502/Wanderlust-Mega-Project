version: "3.8"
services:
  mongodb:
    container_name: mongo-service
    image: mongo:latest
    volumes:
      - ./backend/data:/data
    ports:
      - "27017:27017"

  backend:
    container_name: backend
    build: ./backend
    environment:
      - MONGODB_URI=mongodb://mongo-service/wanderlust
      - REDIS_URL=redis://redis-service:6379
      - PORT=8080
      - FRONTEND_URL=http://frontend-service:5173
      - ACCESS_COOKIE_MAXAGE=120000
      - ACCESS_TOKEN_EXPIRES_IN=120s
      - REFRESH_COOKIE_MAXAGE=120000
      - REFRESH_TOKEN_EXPIRES_IN=120s
      - JWT_SECRET=supersecretjwtkey
      - NODE_ENV=Development
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
      - redis

  frontend:
    container_name: frontend-service
    build: ./frontend
    environment:
      - VITE_API_PATH=http://backend-service:8080
    ports:
      - "5173:5173"

  redis:
    container_name: redis-service
    restart: unless-stopped
    image: redis:7.0.5-alpine 
    expose:
      - 6379
    depends_on:
      - mongodb

volumes:
  data:
