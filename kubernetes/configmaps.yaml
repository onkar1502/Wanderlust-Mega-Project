apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: wanderlust
data:
  MONGODB_URI: "mongodb://mongo-service/wanderlust"
  REDIS_URL: "redis://redis-service:6379"
  PORT: "8080"
  FRONTEND_URL: "http://frontend-service:5173"   # or Ingress domain
  ACCESS_COOKIE_MAXAGE: "120000"
  ACCESS_TOKEN_EXPIRES_IN: "120s"
  REFRESH_COOKIE_MAXAGE: "120000"
  REFRESH_TOKEN_EXPIRES_IN: "120s"
  NODE_ENV: "Development"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: wanderlust
data:
  VITE_API_PATH: "http://backend-service:8080"
